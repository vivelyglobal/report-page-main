<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vively Performance Report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffcf1;
      --surface: #ffffff;
      --surface-2: #ffffff;
      --text: #1b1b1b;
      --muted: #4f4e4e;
      --subtle: #4f4e4e;
      --line: rgba(35, 44, 39, 0.12);
      --line-strong: rgba(35, 44, 39, 0.25);
      --accent: #1b1b1b;
      --accent-2: #232c27;
      --mint: #0ea371;
      --radius: 18px;
      --radius-sm: 12px;
      --max-width: 1200px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text);
      font-family: "Noto Sans KR", "Pretendard", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    .glow-field { display: none; }
    .data-stamp { margin-top: 10px; font-size: 12px; color: #8a8a8a; letter-spacing: 0.02em; }
    .data-stamp .sep { margin: 0 8px; opacity: .5; }
    .src-live { color: #0ea371; font-weight: 700; }
    .src-stale { color: #b08900; font-weight: 700; cursor: help; }
    .src-none { color: #9a9a9a; font-weight: 700; }
    #app:empty::after {
      content: "Loading report…";
      display: block; padding: 120px 0; text-align: center;
      color: #9a9a9a; font-size: 14px; letter-spacing: 0.04em;
    }
    
    .report { position: relative; z-index: 1; max-width: var(--max-width); margin: 0 auto; padding: 56px 40px 90px; }

    /* TOP HEADER LOGO STYLES */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .top-header-left {
      display: flex;
      align-items: center;
    }
    .top-header-left img {
      height: 36px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .top-header-right {
      font-family: "Noto Sans KR", sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #1b1b1b;
      line-height: 1;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      height: 36px;
    }

    .hero { padding: 44px 0 40px; border-bottom: 1px solid var(--line); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4f4e4e;
      margin-bottom: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 7px 14px;
      background: #ffffff;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .title { font-size: 60px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em; margin: 0 0 20px; font-family: "Noto Sans KR", sans-serif; color: #1b1b1b; }
    .title .grad { color: #1b1b1b; background: none; -webkit-text-fill-color: initial; }
    .subtitle { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: #232c27; line-height: 1.5; max-width: 820px; }
    .section { padding: 46px 0; border-bottom: 1px solid var(--line); }
    .section h2 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; color: #1b1b1b; }
    .section h2 .num { font-size: 13px; color: #232c27; font-weight: 700; letter-spacing: 0.12em; display: block; margin-bottom: 8px; }
    .section-intro { color: #4f4e4e; max-width: 860px; margin: 0 0 26px; font-size: 16px; }
    
    .grid-5 { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 12px; 
    }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 20px;
      background: #ffffff !important;
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: 0 12px 30px rgba(35, 44, 39, 0.08); }
    .kpi.card { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 18px 14px; }
    .kpi.hot {
      border: 1px solid var(--line-strong);
      background: #ffffff !important;
      box-shadow: none;
    }
    .kpi.hot::after { display: none; }
    
    .kpi-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #232c27;
      height: 28px;
      display: flex;
      align-items: center;
      line-height: 1.2;
    }
    .kpi-tag-wrap {
      height: 22px;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .kpi-value { 
      font-size: 30px; 
      line-height: 1.05; 
      font-weight: 800; 
      letter-spacing: -0.03em; 
      margin-bottom: 8px; 
      font-variant-numeric: tabular-nums; 
      white-space: nowrap;
      color: #1b1b1b !important;
      background: none !important;
      -webkit-text-fill-color: initial !important;
    }
    .kpi.hot .kpi-value { color: #1b1b1b !important; }
    .kpi-note { font-size: 12px; color: #4f4e4e; line-height: 1.4; }
    
    .tag {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      line-height: 1;
    }
    .tag-brand { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .tag-partnership { background: #fce7f3; color: #db2777; border: 1px solid #fbcfe8; }
    .tag-network { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    .tag-reach { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .tag-virality { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    .insight {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 3px solid #1b1b1b;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: rgba(35, 44, 39, 0.04);
      font-size: 14.5px;
      color: #4f4e4e;
    }
    .insight strong { color: #1b1b1b; }
    .note-box {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: #4f4e4e;
      background: #ffffff;
    }

    .cost-saving-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: #fefce8;
      border: 1px solid #fef08a;
      color: #854d0e;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .cost-saving-box strong {
      color: #713f12;
      font-weight: 800;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4f4e4e;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .case-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; color: #1b1b1b; }
    .list { margin: 0; padding-left: 18px; color: #4f4e4e; }
    .list li { margin-bottom: 9px; }
    .list li::marker { color: #232c27; }

    /* TAB NAVIGATION BAR STYLES */
    .tab-bar-wrap {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }
    .tab-bar-wrap::-webkit-scrollbar { display: none; }
    .tab-btn {
      white-space: nowrap;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: #4f4e4e;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .tab-btn:hover { background: rgba(35, 44, 39, 0.05); color: #1b1b1b; }
    .tab-btn.active { background: #1b1b1b; color: #ffffff; border-color: #1b1b1b; }

    /* PIPELINE & SERVICES STYLES */
    .pipeline-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
    .pipeline-step {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 18px 16px;
      background: #ffffff;
      transition: transform 0.2s, border-color 0.2s;
    }
    .pipeline-step:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .pipeline-step .step-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.08);
      color: #6d28d9;
      border: 1px solid rgba(139, 92, 246, 0.25);
      margin-bottom: 10px;
    }
    .pipeline-step .step-text { font-size: 15px; font-weight: 700; color: #1b1b1b; line-height: 1.35; }

    .tba-box {
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 42px 20px;
      text-align: center;
      background: rgba(35, 44, 39, 0.015);
      margin-top: 16px;
    }
    .tba-title { font-size: 18px; font-weight: 800; color: #1b1b1b; letter-spacing: 0.05em; margin-bottom: 6px; }
    .tba-subtext { font-size: 13.5px; color: #4f4e4e; }

    /* POSITIONING 48 COUNTRIES REGION LIST */
    .region-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 18px;
      margin-top: 14px;
      font-size: 13px;
    }
    .region-item {
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(35, 44, 39, 0.03);
      border: 1px solid rgba(35, 44, 39, 0.08);
    }
    .region-item strong {
      color: #1b1b1b;
    }

    /* CASE STUDY DASHBOARD LAYOUT & STYLES */
    .cs-branches-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .cs-branch-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(35, 44, 39, 0.06);
      color: #232c27;
      border: 1px solid rgba(35, 44, 39, 0.15);
    }
    .overview-schema-list {
      list-style: none;
      padding: 0;
      margin: 0;
      color: #4f4e4e;
      font-size: 14.5px;
    }
    .overview-schema-list li {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .overview-schema-list strong {
      color: #1b1b1b;
    }

    .engagement-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 14px;
    }
    .eng-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px 18px;
      background: #ffffff;
      transition: transform 0.2s, border-color 0.2s;
    }
    .eng-card:hover {
      border-color: var(--line-strong);
      transform: translateY(-2px);
    }
    .eng-card-label {
      font-size: 12px;
      font-weight: 700;
      color: #4f4e4e;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .eng-card-value {
      font-size: 32px;
      font-weight: 800;
      color: #1b1b1b;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .reel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
    .reel {
      position: relative;
      aspect-ratio: 9 / 16;
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: #4f4e4e;
      font-size: 12.5px;
      overflow: hidden;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .reel:hover { border-color: #1b1b1b; transform: translateY(-3px); }
    
    .reel video { 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      pointer-events: none;
    }
    .reel img { 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    .reel .ico {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong);
      font-size: 15px;
      color: #4f4e4e;
      background: rgba(35, 44, 39, 0.03);
    }
    .reel.filled { border-style: solid; border-color: var(--line-strong); }
    .reel.filled .reel-hint { opacity: 0; }
    .reel .reel-hint { padding: 0 12px; transition: opacity 0.3s; }
    .reel .ratio-tag { position: absolute; bottom: 10px; font-size: 10px; letter-spacing: 0.1em; color: #4f4e4e; }
    .reel.filled .ratio-tag, .reel.filled .ico { display: none; }

    /* WHY VIVELY QUOTE & ANIMATED HIGHLIGHTS */
    .quote-hero-box {
      border-left: 4px solid #1b1b1b;
      padding: 24px 28px;
      background: #ffffff;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 20px;
      line-height: 1.6;
      color: #1b1b1b;
      font-weight: 600;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(35, 44, 39, 0.04);
    }

    .hl-anim {
      display: inline;
      background: linear-gradient(to right, #fde047 50%, transparent 50%);
      background-size: 200% 100%;
      background-position: 100% 0;
      transition: background-position 1.2s ease-out;
      padding: 0 4px;
      border-radius: 4px;
    }
    .hl-anim.active {
      background-position: 0 0;
    }

    .footer { font-size: 13px; color: #4f4e4e; line-height: 1.7; padding-top: 28px; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.in { opacity: 1; transform: none; }

    @media (max-width: 1100px) {
      .grid-5 { grid-template-columns: repeat(2, 1fr); }
      .pipeline-grid { grid-template-columns: repeat(2, 1fr); }
      .region-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 1024px) {
      .grid-4, .grid-2, .metric-strip { grid-template-columns: 1fr; }
      .reel-grid { grid-template-columns: repeat(2, 1fr); }
      .title { font-size: 42px; }
      .subtitle { font-size: 19px; }
      .report { padding: 32px 20px 60px; }
      .chart-wrap { height: 280px; }
      .quote-hero-box { font-size: 17px; }
    }
    @media (max-width: 600px) {
      .grid-5, .pipeline-grid, .engagement-cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
/* ══════════════════════════════════════════════════════════════════
   VIVELY REPORT — LIVE DATA LOADER
   Reads the Google Sheet named in SHEET_ID. If the sheet is empty,
   unreachable, or malformed, the built-in snapshot (FALLBACK) is used
   so the page always renders.
   ══════════════════════════════════════════════════════════════════ */
const VIVELY = (() => {
  const FIRSTCOL = {
    Config:"key", KPIs:"label", Positioning:"label", Regions:"region",
    Services:"id",
    Campaigns:"id", WhyPoints:"point"
  };

  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else {
        if (c === '"') q = true;
        else if (c === ",") { row.push(cur); cur = ""; }
        else if (c === "\n") { row.push(cur); cur = ""; rows.push(row); row = []; }
        else if (c !== "\r") cur += c;
      }
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function toObjects(rows, tabName) {
    const want = FIRSTCOL[tabName];
    const hi = rows.findIndex(r => String(r[0] ?? "").trim() === want);
    if (hi < 0) throw new Error('Tab "' + tabName + '": header column "' + want + '" not found');
    const h = rows[hi].map(x => String(x ?? "").trim());
    return rows.slice(hi + 1)
      .filter(r => r.some(c => String(c ?? "").trim() !== ""))
      .map(r => { const o = {}; h.forEach((k, i) => { if (k) o[k] = r[i] ?? ""; }); return o; });
  }

  async function fetchTab(id, name) {
    const url = "https://docs.google.com/spreadsheets/d/" + id +
                "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name) + "&cb=" + Date.now();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 9000);
    try {
      const res = await fetch(url, { signal: ctrl.signal, credentials: "omit" });
      if (!res.ok) throw new Error(name + " → HTTP " + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error(name + " → sheet is not publicly readable");
      return toObjects(parseCSV(text), name);
    } finally { clearTimeout(timer); }
  }

  const S = v => String(v ?? "").trim();
  const N = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; };
  const B = v => ["TRUE", "1", "YES", "Y"].includes(S(v).toUpperCase());
  const P = v => S(v).split("|").map(x => x.trim()).filter(Boolean);

  function buildReport(t) {
    const conf = {}; t.Config.forEach(r => conf[S(r.key)] = S(r.value));
    const regs = t.Regions.map(r => ({ name: S(r.region), count: Math.round(N(r.countries_count)), desc: S(r.countries) }));
    const svc = t.Services.map(r => ({
      id: S(r.id), label: S(r.label), isDefault: B(r.isDefault),
      subcaption: S(r.subcaption), steps: P(r.steps)
    }));
    const camps = t.Campaigns.filter(r => B(r.show)).map(r => ({
      id: S(r.id), name: S(r.name), order: N(r.order), branches: P(r.branches),
      schema: {
        service: S(r.service), goal: S(r.goal), participants: S(r.participants),
        countryReach: S(r.countryReach), keyNote: S(r.keyNote)
      },
      baseViews: Math.round(N(r.views)), baseShares: Math.round(N(r.shares)),
      likes: Math.round(N(r.likes)), comments: Math.round(N(r.comments)),
      posts: Math.round(N(r.posts)), creators: Math.round(N(r.creators))
    })).sort((a, b) => a.order - b.order);
    if (!camps.length) throw new Error("Campaigns tab has no rows with show=TRUE");

    return {
      hero: {
        eyebrow: conf.eyebrow, title: conf.title,
        subtitle: [conf.subtitle_line1, conf.subtitle_line2].filter(Boolean)
      },
      kpiIntro: conf.kpiIntro,
      kpis: t.KPIs.map(r => {
        const k = {
          label: S(r.label), tag: S(r.tag), tagClass: S(r.tagClass), prefix: S(r.prefix),
          suffix: S(r.suffix), note: S(r.note), hot: B(r.hot), isFloat: B(r.isFloat),
          dynamicType: S(r.dynamicType)
        };
        if (S(r.valueText)) k.valueText = S(r.valueText); else k.value = N(r.value);
        return k;
      }),
      kpiInsight: conf.kpiInsight,
      positioningCards: t.Positioning.map(r => ({ label: S(r.label), title: S(r.title), note: S(r.note) })),
      reachTitle: conf.reachTitle, reachInsight: conf.reachInsight,
      reachChartData: { labels: regs.map(r => r.name + " (" + r.count + ")"), values: regs.map(r => r.count) },
      reachRegionsList: regs.map(r => ({ name: r.name + " (" + r.count + "개국)", desc: r.desc })),
      tabServices: {
        tabs: svc.map(s => ({ id: s.id, label: s.label, isDefault: s.isDefault })),
        content: Object.fromEntries(svc.map(s => [s.id, { subcaption: s.subcaption, steps: s.steps }]))
      },
      caseStudyProjects: camps,
      whyQuote: conf.whyQuote,
      whyPoints: t.WhyPoints.map(r => S(r.point)),
      footer: { note: conf.footerNote },
      lastUpdated: conf.lastUpdated
    };
  }

  async function loadTabs(id, names) {
    const got = await Promise.all(names.map(n => fetchTab(id, n)));
    return Object.fromEntries(names.map((n, i) => [n, got[i]]));
  }

  /* ── freshness: remember the last good fetch, report where data came from ── */
  function readCache(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const c = JSON.parse(raw);
      return (c && c.ts && c.data) ? c : null;
    } catch (e) { return null; }
  }
  function writeCache(key, data) {
    try { localStorage.setItem(key, JSON.stringify({ ts: new Date().toISOString(), data })); }
    catch (e) { /* private mode / quota — freshness just falls back to built-in */ }
  }

  /*
     Resolves to { data, status } where status is:
       source     "live" | "cache" | "builtin" | "unconfigured"
       lastRefresh ISO string of the last SUCCESSFUL sheet read, or null
       ageMs       how stale that read is, or null
       error       why the live read failed, or null
  */
  async function load({ sheetId, tabs, build, builtin, cacheKey }) {
    if (!sheetId) {
      return { data: builtin, status: { source: "unconfigured", lastRefresh: null, ageMs: null, error: null } };
    }
    try {
      const data = build(await loadTabs(sheetId, tabs));
      writeCache(cacheKey, data);
      const now = new Date().toISOString();
      return { data, status: { source: "live", lastRefresh: now, ageMs: 0, error: null } };
    } catch (err) {
      const msg = (err && err.message) || String(err);
      const cached = readCache(cacheKey);
      if (cached) {
        return {
          data: cached.data,
          status: { source: "cache", lastRefresh: cached.ts,
                    ageMs: Date.now() - new Date(cached.ts).getTime(), error: msg }
        };
      }
      return { data: builtin, status: { source: "builtin", lastRefresh: null, ageMs: null, error: msg } };
    }
  }

  const LABEL = { live: "Live Sheet", cache: "Cached Snapshot", builtin: "Cached Snapshot", unconfigured: "Built-in Snapshot" };
  function stamp(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function ago(ms) {
    if (ms == null) return "";
    const m = Math.floor(ms / 60000);
    if (m < 1) return "방금 전";
    if (m < 60) return m + "분 전";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "시간 전";
    return Math.floor(h / 24) + "일 전";
  }

  return { parseCSV, toObjects, fetchTab, loadTabs, buildReport, load, stamp, ago, LABEL, S, N, B, P };
})();

                .join("") +

    function startRealtimeEngagementTicker(projectData) {

    /* ============ CHARTS & COUNTERS ============ */
    const valueLabels = {
      id: "valueLabels",

        const horizontal = chart.options.indexAxis === "y";
        const fmt = opts.formatter || ((v) => (opts.prefix || "") + Math.round(v).toLocaleString() + (opts.suffix || ""));
        ctx.save();
        ctx.font = "700 12px 'Noto Sans KR', sans-serif";
        ctx.fillStyle = "#1b1b1b";
        chart.data.datasets.forEach((ds, di) => {
          const meta = chart.getDatasetMeta(di);
          if (!meta || meta.hidden) return;
          meta.data.forEach((bar, i) => {
            const text = fmt(ds.data[i]);
            if (horizontal) {
              ctx.textAlign = "left"; ctx.textBaseline = "middle";
              ctx.fillText(text, bar.x + 10, bar.y);
            } else {
              ctx.textAlign = "center"; ctx.textBaseline = "bottom";
              ctx.fillText(text, bar.x, bar.y - 8);
            }
          });
        });
        ctx.restore();
      }
    };

        responsive: true,
        maintainAspectRatio: false,

          x: { beginAtZero: true, max: 11, ticks: { stepSize: 2, color: axisColor }, grid: { color: gridColor } },
          y: { ticks: { color: axisColor, font: { size: 11, weight: "700" } }, grid: { display: false } }
        }
      },
      plugins: [valueLabels]
    });

    function countUp(el) {
      const target = +el.dataset.target;
      const isFloat = el.dataset.float === "1";
      const dur = 1800;
      const start = performance.now();
      function frame(now) {
        const p = Math.min((now - start) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 4);
        const curr = target * eased;
        el.textContent = isFloat ? curr.toFixed(1) : Math.round(curr).toLocaleString();
        if (p < 1) requestAnimationFrame(frame);
        else {
          el.textContent = isFloat ? target.toFixed(1) : target.toLocaleString();
          if (el.classList.contains("dyn-influencer")) startDynamicCounter(el, target, 20000, 1, false);
          if (el.classList.contains("dyn-views")) startDynamicCounter(el, target, 8000, 5, true);
        }
      }
      requestAnimationFrame(frame);
    }

    function startDynamicCounter(el, initialBase, intervalMs, addVal, isRandom) {
      let currentVal = initialBase;
      setInterval(() => {
        const increment = isRandom ? Math.floor(Math.random() * addVal) + 1 : addVal;
        currentVal += increment;
        el.textContent = currentVal.toLocaleString();
      }, intervalMs);
    }

    const countObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !e.target.dataset.done) {
          e.target.dataset.done = "1";
          countUp(e.target);
        }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll(".count").forEach((el) => countObserver.observe(el));

    /* Reveal on Scroll & Animate Highlights */
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => { 
        if (e.isIntersecting) {
          e.target.classList.add("in");
          e.target.querySelectorAll(".hl-anim").forEach(hl => hl.classList.add("active"));
        } 
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));

    /* Reel media loader without controls */
    const EXTS = ["mp4", "webm", "gif", "jpg", "png"];
    function tryLoad(slot, name, extIndex) {
      if (extIndex >= EXTS.length) return;
      const ext = EXTS[extIndex];
      const src = "media/" + name + "." + ext;
      if (ext === "mp4" || ext === "webm") {
        const v = document.createElement("video");
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.addEventListener("loadeddata", () => { slot.classList.add("filled"); v.play().catch(() => {}); });
        v.addEventListener("error", () => { v.remove(); tryLoad(slot, name, extIndex + 1); });
        v.src = src;
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.alt = name;
        img.addEventListener("load", () => slot.classList.add("filled"));
        img.addEventListener("error", () => { img.remove(); tryLoad(slot, name, extIndex + 1); });
        img.src = src;
        slot.appendChild(img);
      }
    }

    initReelsForProject(defaultProject.id);
    startRealtimeEngagementTicker(defaultProject);

    window.switchCaseStudyTab = switchCaseStudyTab;
    window.switchServiceTab = switchServiceTab;
  }

  /* ── boot: live sheet → last good cache → built-in snapshot ── */
  (async function boot() {
    const TABS = ["Config","KPIs","Positioning","Regions",
                  "Services","Campaigns","WhyPoints"];

    let { data, status } = await VIVELY.load({
      sheetId: SHEET_ID, tabs: TABS, build: VIVELY.buildReport,
      builtin: FALLBACK, cacheKey: "vively_report_v1"
    });

    try {
      renderReport(data);
    } catch (e) {
      console.error("[Vively] Render failed on sheet data — falling back to built-in snapshot.", e);
      if (status.source !== "builtin" && status.source !== "unconfigured") {
        renderReport(FALLBACK);
        status = { source: "builtin", lastRefresh: null, ageMs: null, error: "Render error: " + e.message };
      } else throw e;
    }

    const el = document.getElementById("srcBadge");
    if (el) {
      const live = status.source === "live";
      const cls = live ? "src-live" : (status.source === "unconfigured" ? "src-none" : "src-stale");
      let txt = VIVELY.LABEL[status.source];
      if (status.lastRefresh) txt += " · 마지막 동기화 " + VIVELY.stamp(status.lastRefresh) +
                                     " (" + VIVELY.ago(status.ageMs) + ")";
      el.innerHTML = '<span class="' + cls + '">' + txt + "</span>";
      if (status.error) el.title = status.error;
    }
    console.info("[Vively] data source:", status.source, "| last successful sheet refresh:",
                 status.lastRefresh || "never", status.error ? "| error: " + status.error : "");
  })();
  </script>
</body>
</html>
