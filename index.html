<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vively Performance Report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffcf1;
      --surface: #ffffff;
      --surface-2: #ffffff;
      --text: #1b1b1b;
      --muted: #4f4e4e;
      --subtle: #4f4e4e;
      --line: rgba(35, 44, 39, 0.12);
      --line-strong: rgba(35, 44, 39, 0.25);
      --accent: #1b1b1b;
      --accent-2: #232c27;
      --mint: #0ea371;
      --radius: 18px;
      --radius-sm: 12px;
      --max-width: 1200px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text);
      font-family: "Noto Sans KR", "Pretendard", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    .glow-field { display: none; }
    
    .report { position: relative; z-index: 1; max-width: var(--max-width); margin: 0 auto; padding: 56px 40px 90px; }

    /* TOP HEADER LOGO STYLES */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .top-header-left {
      display: flex;
      align-items: center;
    }
    .top-header-left img {
      height: 36px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .top-header-right {
      font-family: "Noto Sans KR", sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #1b1b1b;
      line-height: 1;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      height: 36px;
    }

    .hero { padding: 44px 0 40px; border-bottom: 1px solid var(--line); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4f4e4e;
      margin-bottom: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 7px 14px;
      background: #ffffff;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .title { font-size: 60px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em; margin: 0 0 20px; font-family: "Noto Sans KR", sans-serif; color: #1b1b1b; }
    .title .grad { color: #1b1b1b; background: none; -webkit-text-fill-color: initial; }
    .subtitle { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: #232c27; line-height: 1.5; max-width: 820px; }
    .section { padding: 46px 0; border-bottom: 1px solid var(--line); }
    .section h2 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; color: #1b1b1b; }
    .section h2 .num { font-size: 13px; color: #232c27; font-weight: 700; letter-spacing: 0.12em; display: block; margin-bottom: 8px; }
    .section-intro { color: #4f4e4e; max-width: 860px; margin: 0 0 26px; font-size: 16px; }
    
    .grid-5 { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 12px; 
    }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 20px;
      background: #ffffff !important;
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: 0 12px 30px rgba(35, 44, 39, 0.08); }
    .kpi.card { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 18px 14px; }
    .kpi.hot {
      border: 1px solid var(--line-strong);
      background: #ffffff !important;
      box-shadow: none;
    }
    .kpi.hot::after { display: none; }
    
    .kpi-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #232c27;
      height: 28px;
      display: flex;
      align-items: center;
      line-height: 1.2;
    }
    .kpi-tag-wrap {
      height: 22px;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .kpi-value { 
      font-size: 30px; 
      line-height: 1.05; 
      font-weight: 800; 
      letter-spacing: -0.03em; 
      margin-bottom: 8px; 
      font-variant-numeric: tabular-nums; 
      white-space: nowrap;
      color: #1b1b1b !important;
      background: none !important;
      -webkit-text-fill-color: initial !important;
    }
    .kpi.hot .kpi-value { color: #1b1b1b !important; }
    .kpi-note { font-size: 12px; color: #4f4e4e; line-height: 1.4; }
    
    .tag {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      line-height: 1;
    }
    .tag-brand { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .tag-partnership { background: #fce7f3; color: #db2777; border: 1px solid #fbcfe8; }
    .tag-network { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    .tag-reach { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .tag-virality { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    .insight {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 3px solid #1b1b1b;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: rgba(35, 44, 39, 0.04);
      font-size: 14.5px;
      color: #4f4e4e;
    }
    .insight strong { color: #1b1b1b; }
    .note-box {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: #4f4e4e;
      background: #ffffff;
    }

    .cost-saving-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: #fefce8;
      border: 1px solid #fef08a;
      color: #854d0e;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .cost-saving-box strong {
      color: #713f12;
      font-weight: 800;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4f4e4e;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .case-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; color: #1b1b1b; }
    .list { margin: 0; padding-left: 18px; color: #4f4e4e; }
    .list li { margin-bottom: 9px; }
    .list li::marker { color: #232c27; }

    /* TAB NAVIGATION BAR STYLES */
    .tab-bar-wrap {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }
    .tab-bar-wrap::-webkit-scrollbar { display: none; }
    .tab-btn {
      white-space: nowrap;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: #4f4e4e;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .tab-btn:hover { background: rgba(35, 44, 39, 0.05); color: #1b1b1b; }
    .tab-btn.active { background: #1b1b1b; color: #ffffff; border-color: #1b1b1b; }

    /* PIPELINE & SERVICES STYLES */
    .pipeline-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
    .pipeline-step {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 18px 16px;
      background: #ffffff;
      transition: transform 0.2s, border-color 0.2s;
    }
    .pipeline-step:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .pipeline-step .step-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.08);
      color: #6d28d9;
      border: 1px solid rgba(139, 92, 246, 0.25);
      margin-bottom: 10px;
    }
    .pipeline-step .step-text { font-size: 15px; font-weight: 700; color: #1b1b1b; line-height: 1.35; }

    .tba-box {
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 42px 20px;
      text-align: center;
      background: rgba(35, 44, 39, 0.015);
      margin-top: 16px;
    }
    .tba-title { font-size: 18px; font-weight: 800; color: #1b1b1b; letter-spacing: 0.05em; margin-bottom: 6px; }
    .tba-subtext { font-size: 13.5px; color: #4f4e4e; }

    /* POSITIONING 48 COUNTRIES REGION LIST */
    .region-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 18px;
      margin-top: 14px;
      font-size: 13px;
    }
    .region-item {
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(35, 44, 39, 0.03);
      border: 1px solid rgba(35, 44, 39, 0.08);
    }
    .region-item strong {
      color: #1b1b1b;
    }

    /* CASE STUDY DASHBOARD LAYOUT & STYLES */
    .cs-branches-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .cs-branch-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(35, 44, 39, 0.06);
      color: #232c27;
      border: 1px solid rgba(35, 44, 39, 0.15);
    }
    .overview-schema-list {
      list-style: none;
      padding: 0;
      margin: 0;
      color: #4f4e4e;
      font-size: 14.5px;
    }
    .overview-schema-list li {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .overview-schema-list strong {
      color: #1b1b1b;
    }

    .engagement-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 14px;
    }
    .eng-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px 18px;
      background: #ffffff;
      transition: transform 0.2s, border-color 0.2s;
    }
    .eng-card:hover {
      border-color: var(--line-strong);
      transform: translateY(-2px);
    }
    .eng-card-label {
      font-size: 12px;
      font-weight: 700;
      color: #4f4e4e;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .eng-card-value {
      font-size: 32px;
      font-weight: 800;
      color: #1b1b1b;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .reel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
    .reel {
      position: relative;
      aspect-ratio: 9 / 16;
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: #4f4e4e;
      font-size: 12.5px;
      overflow: hidden;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .reel:hover { border-color: #1b1b1b; transform: translateY(-3px); }
    
    .reel video { 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      pointer-events: none;
    }
    .reel img { 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    .reel .ico {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong);
      font-size: 15px;
      color: #4f4e4e;
      background: rgba(35, 44, 39, 0.03);
    }
    .reel.filled { border-style: solid; border-color: var(--line-strong); }
    .reel.filled .reel-hint { opacity: 0; }
    .reel .reel-hint { padding: 0 12px; transition: opacity 0.3s; }
    .reel .ratio-tag { position: absolute; bottom: 10px; font-size: 10px; letter-spacing: 0.1em; color: #4f4e4e; }
    .reel.filled .ratio-tag, .reel.filled .ico { display: none; }

    /* WHY VIVELY QUOTE & ANIMATED HIGHLIGHTS */
    .quote-hero-box {
      border-left: 4px solid #1b1b1b;
      padding: 24px 28px;
      background: #ffffff;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 20px;
      line-height: 1.6;
      color: #1b1b1b;
      font-weight: 600;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(35, 44, 39, 0.04);
    }

    .hl-anim {
      display: inline;
      background: linear-gradient(to right, #fde047 50%, transparent 50%);
      background-size: 200% 100%;
      background-position: 100% 0;
      transition: background-position 1.2s ease-out;
      padding: 0 4px;
      border-radius: 4px;
    }
    .hl-anim.active {
      background-position: 0 0;
    }

    .footer { font-size: 13px; color: #4f4e4e; line-height: 1.7; padding-top: 28px; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.in { opacity: 1; transform: none; }

    @media (max-width: 1100px) {
      .grid-5 { grid-template-columns: repeat(2, 1fr); }
      .pipeline-grid { grid-template-columns: repeat(2, 1fr); }
      .region-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 1024px) {
      .grid-4, .grid-2, .metric-strip { grid-template-columns: 1fr; }
      .reel-grid { grid-template-columns: repeat(2, 1fr); }
      .title { font-size: 42px; }
      .subtitle { font-size: 19px; }
      .report { padding: 32px 20px 60px; }
      .chart-wrap { height: 280px; }
      .quote-hero-box { font-size: 17px; }
    }
    @media (max-width: 600px) {
      .grid-5, .pipeline-grid, .engagement-cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="glow-field"></div>

  <div class="report" id="app"></div>

  <script>
  const REPORT = {

      }
    ],
    reachChartData: {

        "중앙아시아 (4)", "동아시아 (4)", "중동 (4)", "남아시아 (3)", 
        "북아프리카 (3)", "북미 (2)", "사하라 이남 (2)", "오세아니아 (1)"
      ],
      values: [9, 7, 5, 4, 4, 4, 4, 3, 3, 2, 2, 1]

    reachRegionsList: [
      { name: "동유럽 (9개국)", desc: "러시아, 우크라이나, 벨라루스, 루마니아, 체코, 몰도바, 아제르바이잔, 슬로베니아, 헝가리" },

      { name: "동아시아 (4개국)", desc: "일본, 대한민국, 대만, 중국" },
      { name: "중동 (4개국)", desc: "이란, 요르단, 사우디아라비아, 바레인" },

            '<ul class="overview-schema-list">' +
              '<li>★ <strong>서비스:</strong> ' + esc(s.service) + '</li>' +
              '<li>★ <strong>목표:</strong> ' + esc(s.goal) + '</li>' +
              '<li>★ <strong>참여:</strong> ' + esc(s.participants) + '</li>' +
              '<li>★ <strong>분포:</strong> ' + esc(s.countryReach) + '</li>' +
              '<li>★ <strong>노트:</strong> ' + esc(s.keyNote) + '</li>' +
            '</ul>' +
          '</div>' +
        '</div>' +

        /* 3. 성과 & 참여 반응 (EXACTLY 2 CARDS: 총 조회수 & 공유) */
        '<div style="margin-top: 24px;">' +
          '<div class="card">' +
            '<div class="case-title">성과 & 참여 반응 ' + liveBadge + '</div>' +
            '<div class="engagement-cards-grid">' +
              '<div class="eng-card">' +
                '<div class="eng-card-label"><span class="live-dot"></span> 총 조회수</div>' +
                '<div class="eng-card-value" id="liveViewsVal">' + p.baseViews.toLocaleString() + '</div>' +
              '</div>' +
              '<div class="eng-card">' +
                '<div class="eng-card-label"><span class="live-dot"></span> 공유</div>' +
                '<div class="eng-card-value" id="liveSharesVal">' + p.baseShares.toLocaleString() + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function startRealtimeEngagementTicker(projectData) {
      if (liveTickerInterval) clearInterval(liveTickerInterval);

      let currentViews = projectData.baseViews;
      let currentShares = projectData.baseShares;

      liveTickerInterval = setInterval(() => {
        currentViews += Math.floor(Math.random() * 3) + 1;
        if (Math.random() > 0.6) { currentShares += 1; }

        const viewsEl = document.getElementById("liveViewsVal");
        const sharesEl = document.getElementById("liveSharesVal");

        if (viewsEl) viewsEl.textContent = currentViews.toLocaleString();
        if (sharesEl) sharesEl.textContent = currentShares.toLocaleString();
      }, 5000);
    }

    function initReelsForProject(projectId) {
      const wrap = document.getElementById("reels-" + projectId);
      if (!wrap) return;
      wrap.innerHTML = "";
      for (let i = 1; i <= 4; i++) {
        const name = projectId + "-" + i;
        const slot = document.createElement("div");
        slot.className = "reel";
        slot.innerHTML =
          '<div class="ico">▶</div>' +
          '<div class="reel-hint">media/' + name + ".mp4<br />파일을 media 폴더에 넣으면 자동 표시</div>" +
          '<span class="ratio-tag">REELS · 1080 × 1920</span>';
        tryLoad(slot, name, 0);
        wrap.appendChild(slot);
      }
    }

    function switchCaseStudyTab(projectId, btnEl) {
      document.querySelectorAll('#csTabBar .tab-btn').forEach(btn => btn.classList.remove('active'));
      btnEl.classList.add('active');

      const projectData = REPORT.caseStudyProjects.find(p => p.id === projectId);
      if (projectData) {
        document.getElementById('csDisplayArea').innerHTML = renderCaseStudyContent(projectData);
        initReelsForProject(projectId);
        startRealtimeEngagementTicker(projectData);
      }
    }

    function switchServiceTab(tabId, btnEl) {
      document.querySelectorAll('#serviceTabBar .tab-btn').forEach(btn => btn.classList.remove('active'));
      btnEl.classList.add('active');

      const contentArea = document.getElementById('serviceTabContent');
      if (tabId === 'kol') {
        const kol = REPORT.tabServices.kolContent;
        contentArea.innerHTML = 
          '<div class="kpi-note" style="margin-bottom: 12px;">' + esc(kol.subcaption) + '</div>' +
          '<div class="pipeline-grid">' +
          kol.steps.map((step, idx) => 
            '<div class="pipeline-step"><span class="step-badge">STEP 0' + (idx + 1) + '</span><div class="step-text">' + esc(step) + '</div></div>'
          ).join("") +
          '</div>';
      } else {
        contentArea.innerHTML = 
          '<div class="tba-box">' +
          '<div class="tba-title">TBA (To Be Announced)</div>' +
          '<div class="tba-subtext">해당 서비스의 프로세스 및 가이드라인은 곧 업데이트될 예정입니다.</div>' +
          '</div>';
      }
    }

    /* ============ CHARTS & COUNTERS ============ */
    const valueLabels = {
      id: "valueLabels",
      afterDatasetsDraw(chart, _, opts) {
        const { ctx } = chart;
        const horizontal = chart.options.indexAxis === "y";
        const fmt = opts.formatter || ((v) => (opts.prefix || "") + Math.round(v).toLocaleString() + (opts.suffix || ""));
        ctx.save();
        ctx.font = "700 12px 'Noto Sans KR', sans-serif";
        ctx.fillStyle = "#1b1b1b";
        chart.data.datasets.forEach((ds, di) => {
          const meta = chart.getDatasetMeta(di);
          if (!meta || meta.hidden) return;
          meta.data.forEach((bar, i) => {
            const text = fmt(ds.data[i]);
            if (horizontal) {
              ctx.textAlign = "left"; ctx.textBaseline = "middle";
              ctx.fillText(text, bar.x + 10, bar.y);
            } else {
              ctx.textAlign = "center"; ctx.textBaseline = "bottom";
              ctx.fillText(text, bar.x, bar.y - 8);
            }
          });
        });
        ctx.restore();
      }
    };

    const charts = {};

    /* 48 Countries Horizontal Bar Chart in Section 02 */
    charts.reach48Chart = new Chart(document.getElementById("reach48Chart"), {
      type: "bar",
      data: {
        labels: R.reachChartData.labels,
        datasets: [{
          label: "도달 국가 수",
          data: R.reachChartData.values,
          backgroundColor: DARK_SUB,
          borderRadius: 6,
          maxBarThickness: 22
        }]
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, valueLabels: { suffix: "개국" } },
        scales: {
          x: { beginAtZero: true, max: 11, ticks: { stepSize: 2, color: axisColor }, grid: { color: gridColor } },
          y: { ticks: { color: axisColor, font: { size: 11, weight: "700" } }, grid: { display: false } }
        }
      },
      plugins: [valueLabels]
    });

    /* CPM Chart in Section 04 */
    charts.cpmChart = new Chart(document.getElementById("cpmChart"), {
      type: "bar",
      data: {
        labels: R.cpmBenchmarks.map((b) => b.label).concat(["준오헤어 ✦", "자임당 ✦"]),
        datasets: [{
          data: R.cpmBenchmarks.map((b) => b.value).concat([2731, 3165]),
          backgroundColor: (c) => c.dataIndex >= 4 ? DARK_MAIN : GRAY2,
          borderRadius: 8, borderSkipped: false, maxBarThickness: 58
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 1400, easing: "easeOutQuart" },
        plugins: { legend: { display: false }, valueLabels: { prefix: "₩" } },
        scales: {
          x: { ticks: { color: axisColor }, grid: { display: false } },
          y: { 
            beginAtZero: true,
            max: 25000,
            suggestedMax: 25000,
            ticks: { stepSize: 5000, color: axisColor, callback: (v) => "₩" + v.toLocaleString() }, 
            grid: { color: gridColor } 
          }
        }
      },
      plugins: [valueLabels]
    });

    function countUp(el) {
      const target = +el.dataset.target;
      const isFloat = el.dataset.float === "1";
      const dur = 1800;
      const start = performance.now();
      function frame(now) {
        const p = Math.min((now - start) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 4);
        const curr = target * eased;
        el.textContent = isFloat ? curr.toFixed(1) : Math.round(curr).toLocaleString();
        if (p < 1) requestAnimationFrame(frame);
        else {
          el.textContent = isFloat ? target.toFixed(1) : target.toLocaleString();
          if (el.classList.contains("dyn-influencer")) startDynamicCounter(el, target, 20000, 1, false);
          if (el.classList.contains("dyn-views")) startDynamicCounter(el, target, 8000, 5, true);
        }
      }
      requestAnimationFrame(frame);
    }

    function startDynamicCounter(el, initialBase, intervalMs, addVal, isRandom) {
      let currentVal = initialBase;
      setInterval(() => {
        const increment = isRandom ? Math.floor(Math.random() * addVal) + 1 : addVal;
        currentVal += increment;
        el.textContent = currentVal.toLocaleString();
      }, intervalMs);
    }

    const countObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !e.target.dataset.done) {
          e.target.dataset.done = "1";
          countUp(e.target);
        }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll(".count").forEach((el) => countObserver.observe(el));

    /* Reveal on Scroll & Animate Highlights */
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => { 
        if (e.isIntersecting) {
          e.target.classList.add("in");
          e.target.querySelectorAll(".hl-anim").forEach(hl => hl.classList.add("active"));
        } 
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));

    /* Reel media loader without controls */
    const EXTS = ["mp4", "webm", "gif", "jpg", "png"];
    function tryLoad(slot, name, extIndex) {
      if (extIndex >= EXTS.length) return;
      const ext = EXTS[extIndex];
      const src = "media/" + name + "." + ext;
      if (ext === "mp4" || ext === "webm") {
        const v = document.createElement("video");
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.addEventListener("loadeddata", () => { slot.classList.add("filled"); v.play().catch(() => {}); });
        v.addEventListener("error", () => { v.remove(); tryLoad(slot, name, extIndex + 1); });
        v.src = src;
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.alt = name;
        img.addEventListener("load", () => slot.classList.add("filled"));
        img.addEventListener("error", () => { img.remove(); tryLoad(slot, name, extIndex + 1); });
        img.src = src;
        slot.appendChild(img);
      }
    }

    // Initialize default project (juno) and its realtime live ticker
    initReelsForProject("juno");
    startRealtimeEngagementTicker(defaultProject);
  </script>
</body>
</html>
