<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VIVELY — Campaign Performance</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="vively.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     PARTNER PAGE — this is the root URL. It is handed out to partners,
     so it must never gain editing controls. The console lives at
     console.html and is not linked from here on purpose.
     ═══════════════════════════════════════════════════════════════════ -->

<div class="wrap">
  <div class="topbar">
    <div>
      <h1><span class="dot idle" id="dot"></span><span id="title">Loading…</span></h1>
      <p class="sub" id="subtitle">Reading campaign data</p>
    </div>
    <div class="spacer"></div>
    <label class="field" style="margin:0;min-width:200px">
      <span>Open campaign</span>
      <select id="view"><option>All campaigns</option></select>
    </label>
    <button class="btn" id="copy">Copy link</button>
    <button class="btn primary" id="csv">Export CSV</button>
  </div>

  <div id="msg"></div>
  <div class="kpis" id="kpis"></div>
  <div id="body"></div>

  <p class="foot" id="stamp"></p>
</div>

<div class="toast" id="toast"></div>

<script>window.VIVELY_PAGE = "landing";</script>
<script src="config.js"></script>
<script src="vively.js"></script>
<script src="report.js"></script>
</body>
</html>
